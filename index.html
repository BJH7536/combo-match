<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- 주의: 이 태그만으로는 재방문 캐시를 막지 못한다(2026-07-29 실측).
         GitHub Pages가 `Cache-Control: max-age=600`을 HTTP 헤더로 보내고 헤더가 meta보다
         우선하며, 이미 캐시된 문서에는 새 meta가 닿지도 않는다(받아야 읽는데 캐시라 안 받음).
         재방문자는 max-age 만료(10분) 뒤 최신을 받고, 첫 방문자는 애초에 영향이 없다.
         헤더를 제어할 수 있는 호스팅으로 옮길 때를 위해 남겨둔다. -->
    <meta http-equiv="Cache-Control" content="no-cache, must-revalidate" />
    <title>우드 콘솔 · 같은 그림 찾기</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #191b21;
      }
      #game {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
